# la migration et le backend ont la meme base
# les deux services vont hériter de la meme image et des memes volumes.
x-server-base: &server-base
  build: ./apps/server
  image: ${COMPOSE_PROJECT_NAME:-better-intra}-server
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  # Bind mount dev pour le hot reload et le debug.
  volumes:
    - ./apps/server/app:/app/app
    - ./apps/server/alembic:/app/alembic

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # herite de la meme image que le backend, mais ne fait qu'une migration et s'arrete.
  migrate:
    <<: *server-base
    entrypoint: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *server-base
    # --reload-dir remplace la racine surveillee par defaut (/app) : seul le code
    # de l'API declenche un reload, plus les migrations que l'API n'importe pas.
    command: ["--reload", "--reload-dir", "/app/app"]
    ports:
      # Publié pour du debug direct (curl, Swagger) pendant le dev, sur la
      # loopback uniquement. Le navigateur, lui, doit toujours passer par
      # https://localhost:8443 (proxy). Voir docs/deploiement.md.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  db_data:
