# la migration et le backend ont la meme base
# les deux services vont hériter de la meme image et des memes volumes.
x-server-base: &server-base
  build: ./apps/server
  image: ${COMPOSE_PROJECT_NAME:-better-intra}-server
  environment:
    ENVIRONMENT: ${ENVIRONMENT:?manquant dans .env}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?manquant dans .env}:${POSTGRES_PASSWORD:?manquant dans .env}@db:5432/${POSTGRES_DB:?manquant dans .env}
    FRONTEND_URL: https://${DOMAIN_NAME:?manquant dans .env}
    JWT_SECRET: ${JWT_SECRET:?manquant dans .env}
    JWT_ALGORITHM: ${JWT_ALGORITHM:?manquant dans .env}
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:?manquant dans .env}
    JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:?manquant dans .env}
    FORTY_TWO_CLIENT_ID: ${FORTY_TWO_CLIENT_ID:?manquant dans .env}
    FORTY_TWO_CLIENT_SECRET: ${FORTY_TWO_CLIENT_SECRET:?manquant dans .env}
    FORTY_TWO_REDIRECT_URI: https://${DOMAIN_NAME:?manquant dans .env}/api/auth/callback
    API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:?manquant dans .env}
  # Bind mount dev pour le hot reload et le debug.
#  volumes:
#    - ./apps/server/app:/app/app
#    - ./apps/server/alembic:/app/alembic

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # herite de la meme image que le backend, mais ne fait qu'une migration et s'arrete.
  migrate:
    <<: *server-base
    entrypoint: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  # Api Server
  backend:
    <<: *server-base
    # --reload dans le cas ou on veut hotreload en dev
#    command: ["--reload", "--reload-dir", "/app/app"]
#    ports:
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # build Vite static :dist/ → /usr/share/nginx/html.
  web:
    build:
      context: ./apps/web
      # VITE_API_URL est utilisee au build seulement.
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: ${COMPOSE_PROJECT_NAME:-better-intra}-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Collecte des metriques. Jamais un
  # demarre avec "make monitoring-up".
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  prometheus_data:
