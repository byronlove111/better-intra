# la migration et le backend ont la meme base a heriter
x-server-base: &server-base
  build: ./apps/server
  image: ${COMPOSE_PROJECT_NAME:-better-intra}-server
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-dev}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-betterintra}:${POSTGRES_PASSWORD:?manquant dans .env}@db:5432/${POSTGRES_DB:-betterintra}
    FRONTEND_URL: https://${DOMAIN_NAME:?manquant dans .env}
    JWT_SECRET: ${JWT_SECRET:?manquant dans .env}
    FORTY_TWO_CLIENT_ID: ${FORTY_TWO_CLIENT_ID:?manquant dans .env}
    FORTY_TWO_CLIENT_SECRET: ${FORTY_TWO_CLIENT_SECRET:?manquant dans .env}
    FORTY_TWO_REDIRECT_URI: https://${DOMAIN_NAME:?manquant dans .env}/api/auth/callback
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

services:
  db:
    container_name: db
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betterintra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-betterintra}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    container_name: redis
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # herite de la meme image que le backend, mais ne fait qu'une migration stop
  migrate:
    <<: *server-base
    container_name: migrate
    entrypoint: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  # Api Server
  backend:
    <<: *server-base
    container_name: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # build Vite static
  web:
    build:
      context: ./apps/web
      # VITE_API_URL est utilisee au build seulement.
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: ${COMPOSE_PROJECT_NAME:-better-intra}-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  proxy:
    container_name: proxy
    image: docker.io/library/nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Collecte des metriques. Jamais un
  # demarre avec "make monitoring-up".
  prometheus:
    container_name: prometheus
    image: docker.io/prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  prometheus_data:
