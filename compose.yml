services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  backend:
    build: ./apps/server
    env_file: .env
    environment:
      # Surcharge volontaire : .env.DATABASE_URL vise "localhost" (dev Homebrew
      # hors Docker, voir README). Dans le réseau du compose, Postgres est
      # joignable via le nom du service "db", pas "localhost" ni 127.0.0.1.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Code monté en live : les changements sur apps/server/app sont visibles
    # dans le container sans rebuild d'image (le .venv, lui, reste celui buildé
    # dans l'image — un ajout de dépendance nécessite toujours un rebuild).
    volumes:
      - ./apps/server/app:/app/app
    command: ["--reload"]
    ports:
      # Publié pour du debug direct (curl, Swagger) pendant le dev, sur la
      # loopback uniquement. Le navigateur, lui, doit toujours passer par
      # https://localhost:8443 (proxy). Voir docs/deploiement.md.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  db_data:
