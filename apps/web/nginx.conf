# Sert le build statique (dist/) du SPA React/Vite. Fallback try_files pour
# le client-side routing de react-router (BrowserRouter) : une route front
# comme /profile n'existe pas comme fichier, on retombe sur index.html.
server {
    listen 80;
    server_name localhost;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
