# Reverse proxy HTTPS local, devant API + Frontend

# Upgrade WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Redirect HTPP to HTTPS (useless: NGINX will not forwad 80 anyway)
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    # DNS interne Docker : force nginx a re-resoudre web/backend au lieu de
    # figer leur IP au demarrage (sinon 502 des qu'un des deux est recree
    # par un rebuild sans redemarrer proxy).
    resolver 127.0.0.11 valid=10s;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # FastApi service
    location /api/media/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control     "no-store, no-cache, must-revalidate, max-age=0" always;
        expires            -1;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Grafana (bonus monitoring) : l'URI est
    # transmise telle quelle, ce que GF_SERVER_SERVE_FROM_SUB_PATH attend.
    location /admin/grafana/ {
        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend service
    location / {
        set $web_upstream http://web:80;
        proxy_pass         $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
