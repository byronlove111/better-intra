# Reverse proxy HTTPS local, devant l'API. Le sujet exige que le navigateur ne
# parle jamais en clair au backend ; en interne (proxy -> backend), le HTTP
# reste autorisé. Certificat self-signed généré par `make certs` (voir
# Makefile), monté en lecture seule — jamais committé (.gitignore).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    # Port 8443 en dur : nginx (dans le réseau Docker) ne voit pas le port
    # publié côté hôte (8443, pas 443 — voir compose.yml / docs/deploiement.md).
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # location unique : sert l'API REST et, plus tard, les endpoints
    # WebSocket (chat, notifs, online — module WS du CDC) sans config à
    # ajouter, grâce au header Upgrade conditionnel ci-dessous.
    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
