name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest + Postgres)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: betterintra
          POSTGRES_PASSWORD: betterintra
          POSTGRES_DB: betterintra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betterintra -d betterintra_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://betterintra:betterintra@localhost:5432/betterintra_test
      JWT_SECRET: ci-only-not-a-real-secret
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -q

  frontend-build:
    name: Frontend build (pnpm + tsc + vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (typecheck + vite build)
        run: pnpm run build
