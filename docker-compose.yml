services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: betterintra
      POSTGRES_PASSWORD: betterintra
      POSTGRES_DB: betterintra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betterintra -d betterintra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/server
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    environment:
      DATABASE_URL: postgresql+psycopg://betterintra:betterintra@db:5432/betterintra
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
